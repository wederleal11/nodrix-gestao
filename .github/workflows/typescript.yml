name: Nodrix type safety

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install dependencies
        run: npm install --no-audit --no-fund --legacy-peer-deps
      - name: Test project links
        run: npx tsx --test src/utils/projectLinks.test.ts src/components/tasks/TaskTextDetails.test.tsx
      - name: Test JSON and CSV task import
        run: npx tsx --test src/services/taskImport.test.ts
      - name: Test task attachments
        run: npx tsx --test src/services/taskImages.test.ts
      - name: Test task dependency graph
        run: npx tsx --test src/utils/taskDependencies.test.ts
      - name: Check TypeScript
        run: npm run lint
      - name: Build client
        run: npm run build
